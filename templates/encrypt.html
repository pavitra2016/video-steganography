<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Steganography - Encryption</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background: linear-gradient(135deg,#1d2671,#c33764);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:#ffffff;
    width:400px;
    padding:35px 30px;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    text-align:center;
}

h2{
    margin-bottom:25px;
}

label{
    display:block;
    text-align:left;
    margin-bottom:6px;
    font-weight:600;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#c33764;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d2671;
}

.link{
    margin-top:15px;
}

.link a{
    color:#c33764;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <h2>🔐 Video Steganography – Encryption</h2>

    <form method="POST" enctype="multipart/form-data">

        <label>Upload Video</label>
        <input type="file" name="video" required>

        <label>Secret Message</label>
        <input type="text" name="message" placeholder="Enter secret message" required>

        <label>Encryption Key</label>
        <input type="text" name="key" placeholder="Minimum 4 characters" required>

        
        <button type="submit">Encrypt Message</button>

    </form>

    <div class="link">
        <a href="/decrypt">Go to Decryption →</a>
    </div>
</div>

</body>
</html>
